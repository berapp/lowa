<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOWA - Large Outdoor Wifi Analysis</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .container {
      background: white;
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 600px;
      width: 90%;
    }

    h1 {
      color: #667eea;
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }

    .subtitle {
      color: #666;
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .info {
      background: #f7f7f7;
      padding: 1.5rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }

    .info p {
      margin: 0.5rem 0;
      font-size: 1rem;
      color: #555;
    }

    .version {
      font-weight: bold;
      color: #764ba2;
    }

    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 0.5rem;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #e8f5e9;
      border-radius: 10px;
      color: #2e7d32;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛜 LOWA</h1>
    <div class="subtitle">Large Outdoor Wifi Analysis</div>
    
    <div class="info">
      <p>Welcome to the LOWA Electron Application</p>
      <p>Version: <span class="version" id="app-version">1.0.0</span></p>
      <p>Node: <span class="version" id="node-version"></span></p>
      <p>Chrome: <span class="version" id="chrome-version"></span></p>
      <p>Electron: <span class="version" id="electron-version"></span></p>
    </div>

    <button class="button" id="start-btn">Start Analysis</button>
    
    <div class="status" id="status" style="display: none;">
      Ready to analyze WiFi networks
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
