<!DOCTYPE html>
<html>
<head>
  <title>LOWA - RV Resort WiFi Speed Visualization</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:">
  <link rel="stylesheet" href="leaflet.css" />
  <link rel="stylesheet" href="font-awesome.min.css" />
  <link rel="stylesheet" href="leaflet.awesome-markers.css" />
  <link rel="stylesheet" href="style2.css" />
</head>
<body>
  <div id="map"></div>
  <div id="ap-select-panel" class="panel">
    <label for="ap-select">Select Access Point: </label>
    <select id="ap-select">
      <option value="">-- Choose AP --</option>
    </select>
    <div id="filter-controls" class="filter-controls">
      <label for="band-select">Band:</label>
      <select id="band-select">
        <option value="all">All bands</option>
        <option value="2.4">2.4 GHz</option>
        <option value="5">5 GHz</option>
      </select>

      <label for="dir-select">Direction:</label>
      <select id="dir-select">
        <option value="all">All</option>
        <option value="upload">Upload</option>
        <option value="download">Download</option>
      </select>

      <label for="min-throughput">Mbps:</label>
      <input id="min-throughput" type="number" placeholder="min" min="0" style="width:60px" />
      <input id="max-throughput" type="number" placeholder="max" min="0" style="width:60px" />

      <div id="test-count" class="test-count">Shown: 0</div>
    </div>
    <div style="margin-top:8px">
      <button id="reload-data" class="btn">Reload data</button>
    </div>
    <!-- Marker details: populated with the list of tests currently shown -->
    <div id="marker-details" class="marker-details">
      <div class="marker-details-header">
        <strong>Details</strong>
        <label for="sort-select" style="margin-left:8px">Sort:</label>
        <select id="sort-select">
          <option value="none">None</option>
          <option value="throughput">Throughput</option>
          <option value="time">Time</option>
          <option value="signal">Signal</option>
        </select>
        <select id="sort-order">
          <option value="desc">Desc</option>
          <option value="asc">Asc</option>
        </select>
      </div>
      <div id="marker-details-list" class="marker-details-list">No tests selected</div>
    </div>
  </div>
  <div id="legend-panel" class="panel"></div>
  <div style="position: absolute; left: 10px; bottom: 10px; z-index:1000; background: rgba(255,255,255,0.9); padding:6px; border-radius:4px; font-size:12px; color:#333">UDP packet counts (packets/lost) shown when available</div>
  <script src="leaflet.js"></script>
  <script src="papaparse.min.js"></script>
  <script src="leaflet-heat.js"></script>
  <script src="leaflet.awesome-markers.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
